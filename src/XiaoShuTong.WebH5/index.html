<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小书童-背书伴侣</title>
    <style>
      /* 内联样式确保主题色立即生效，避免闪烁 */
      /* 主题 class 由 src/lib/theme.ts 的 initTheme() 在 main.tsx 中最早应用 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      /* 兜底：JS 未加载时跟随系统 */
      @media (prefers-color-scheme: dark) {
        html:not(.light) {
          background-color: #1a1a1a !important;
          color: #ffffff;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
