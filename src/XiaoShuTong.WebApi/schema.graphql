"""
登录认证方式：描述用户通过何种方式证明身份。
与 EnumLoginFrom（客户端渠道）是正交的两个概念。
"""
enum EnumLoginAuthType {
  PASSWORD
  SMS_CODE
  WE_CHAT_SCAN
  WE_CHAT_APPLET
  O_AUTH
  SECURE_PASSWORD
  UNSET
}

enum EnumLoginFrom {
  CUSTOMIZED
  PC_WEB
  MOBILE_WEB
  APP
  WECHAT_WEP
  WECHAT_APP
  ALI_PAY_WEB
  ALI_PAY_APP
  E_LINK_APP
  """
  V4.9.9: 系统身份（后台任务、OAuth 回调、系统服务）。
  取值 100 高位保留，避免与后续顺序新增值冲突。
  """
  SYSTEM
  TESTER
  UNSET
}

"求助档位"
enum HintLevel {
  "未求助（独立作答）"
  NONE
  "部分提示（点击\"请提示我\"后作答）"
  PARTIAL
