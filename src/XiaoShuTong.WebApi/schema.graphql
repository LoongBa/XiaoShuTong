  groupId: Long!
  "群组名"
  groupName: String!
  "成员角色（student/parent）"
  role: String!
  "GroupMembers Id"
  memberId: Long!
}

"题库卡片项 DTO（复用 BanksDto + 计数壳）"
type BankListItemDto {
  "题库信息（复用 BanksDto）"
  bank: BanksDto
  "知识点数（切片简化为 0，B.2 展示完整树）"
  topicCount: Int!
  "题量"
  questionCount: Int!
}

"题库元数据（API 查询索引） 的手写 DTO 扩展"
type BanksDto {
  isFromPersistentSource: Boolean!
  "自增主键"
  id: Long!
  "外部业务键（uuid，API/DTO 暴露）"
  uId: String!
  "业务键（chinese-7to9-pep）"
  bankId: String!
  "题库名（≤128）"
  name: String!
  "学科"
  subject: Subject!
  "内容版本（MinVer）"
  version: String!
  "用途（Memorize/Assess/Play）"
  purpose: BankPurpose!
  "隐私（Private/Public/Group）"
  privacy: BankPrivacy!
  "私域题库 owner（官方题库 NULL）"
  ownerId: Long
  "bank.v1.json 文件路径（内容权威）"
  jsonPath: String!
  "标签（JSONB，如 [\"高频考点\"]）"
  tags: [String!]!
  "状态（Active/Hidden/Archived）"
  status: BankStatus!
  "创建时间"
  createTime: DateTime!
  "更新时间"
  updateTime: DateTime!
}

