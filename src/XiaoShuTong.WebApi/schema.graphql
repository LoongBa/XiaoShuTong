schema {
  query: Query
  mutation: Mutation
}

"""
GraphQL Query 根类型空壳。
由 UseGraphQL() 自动注册为 HC 的 Query 根类型。
所有查询通过 [ExtendObjectType] 或 [AutoQueryResolver] 自动扩展到此类型下。
"""
type Query {
  requestChallenge(userName: String): ChallengeResponse @cost(weight: "10")
  registerSecure(input: RegisterSecureInput): RegisterResult @cost(weight: "10")
  createBank_Execute(request: CreateBankReqDtoInput): CreateBankResDto
    @cost(weight: "10")
  bankDetail_Execute(request: GetBankDetailReqDtoInput): GetBankDetailResDto
    @cost(weight: "10")
  knowledgeCard_Execute(request: GetKnowledgeCardReqDtoInput): GetKnowledgeCardResDto
    @cost(weight: "10")
  importQuestions_Execute(request: ImportQuestionsReqDtoInput): ImportQuestionsResDto
    @cost(weight: "10")
  listBanks_Execute(request: ListBanksReqDtoInput): ListBanksResDto
    @cost(weight: "10")
  reviewBackingPoints_Execute(request: ReviewBackingPointsReqDtoInput): ReviewBackingPointsResDto
    @cost(weight: "10")
  acceptBuddyInvite_Execute(request: AcceptBuddyInviteReqDtoInput): AcceptBuddyInviteResDto
    @cost(weight: "10")
  buddyRank_Execute(request: GetBuddyRankReqDtoInput): GetBuddyRankResDto
    @cost(weight: "10")
  inviteBuddy_Execute(request: InviteBuddyReqDtoInput): InviteBuddyResDto
    @cost(weight: "10")
  listBuddies_Execute: ListBuddiesResDto @cost(weight: "10")
  rejectBuddyInvite_Execute(request: RejectBuddyInviteReqDtoInput): RejectBuddyInviteResDto
    @cost(weight: "10")
  removeBuddy_Execute(request: RemoveBuddyReqDtoInput): RemoveBuddyResDto
    @cost(weight: "10")
  activateMember_Execute(request: ActivateMemberReqDtoInput): ActivateMemberResDto
    @cost(weight: "10")
  createGroup_Execute(request: CreateGroupReqDtoInput): CreateGroupResDto
    @cost(weight: "10")
  exportRosterCsv_Execute(request: ExportRosterCsvReqDtoInput): ExportRosterCsvResDto
    @cost(weight: "10")
  generateInviteCodes_Execute(request: GenerateInviteCodesReqDtoInput): GenerateInviteCodesResDto
    @cost(weight: "10")
  rosterPreview_Execute(request: GetRosterPreviewReqDtoInput): RosterPreviewResDto
    @cost(weight: "10")
  importRoster_Execute(request: ImportRosterReqDtoInput): ImportRosterResDto
    @cost(weight: "10")
  listGroups_Execute(request: ListGroupsReqDtoInput): ListGroupsResDto
    @cost(weight: "10")
  members(request: GetMembersReqDtoInput): GroupDetailResDto @cost(weight: "10")
  setRankEnabled_Execute(request: SetRankEnabledReqDtoInput): SetRankEnabledResDto
    @cost(weight: "10")
  submitJudgmentFeedback_Execute(request: SubmitJudgmentFeedbackReqDtoInput): SubmitJudgmentFeedbackResDto
    @cost(weight: "10")
  createStudySession_Execute(request: CreateStudySessionReqDtoInput): CreateStudySessionResDto
    @cost(weight: "10")
  hint_Execute(request: GetHintReqDtoInput): GetHintResDto @cost(weight: "10")
  memoryStates_Execute(request: GetMemoryStatesReqDtoInput): GetMemoryStatesResDto
    @cost(weight: "10")
  reviewQueue_Execute(request: GetReviewQueueReqDtoInput): GetReviewQueueResDto
    @cost(weight: "10")
  sessionResult_Execute(request: GetSessionResultReqDtoInput): GetSessionResultResDto
    @cost(weight: "10")
  wrongQuestions_Execute(request: GetWrongQuestionsReqDtoInput): GetWrongQuestionsResDto
    @cost(weight: "10")
  submitAttempt_Execute(request: SubmitAttemptReqDtoInput): SubmitAttemptResDto
    @cost(weight: "10")
  cancelSubscription_Execute(request: CancelSubscriptionReqDtoInput): CancelSubscriptionResDto
    @cost(weight: "10")
  createParentRelation_Execute(request: CreateParentRelationReqDtoInput): CreateParentRelationResDto
    @cost(weight: "10")
  dashboardReport_Execute(request: GetDashboardReportReqDtoInput): GetDashboardReportResDto
    @cost(weight: "10")
  progressReport_Execute(request: GetProgressReportReqDtoInput): GetProgressReportResDto
    @cost(weight: "10")
  weaknessReport_Execute(request: GetWeaknessReportReqDtoInput): GetWeaknessReportResDto
    @cost(weight: "10")
  listChildren_Execute: ListChildrenResDto @cost(weight: "10")
  listSubscriptions_Execute: ListSubscriptionsResDto @cost(weight: "10")
  startTrial_Execute(request: StartTrialReqDtoInput): StartTrialResDto
    @cost(weight: "10")
  createPkMatch_Execute(request: CreatePkMatchReqDtoInput): CreatePkMatchResDto
    @cost(weight: "10")
  pkResult_Execute(request: GetPkResultReqDtoInput): GetPkResultResDto
    @cost(weight: "10")
  pkStats_Execute(request: GetPkStatsReqDtoInput): GetPkStatsResDto
    @cost(weight: "10")
  joinPkMatch_Execute(request: JoinPkMatchReqDtoInput): JoinPkMatchResDto
    @cost(weight: "10")
  submitPkAnswer_Execute(request: SubmitPkAnswerReqDtoInput): SubmitPkAnswerResDto
    @cost(weight: "10")
  myRanking_Execute(request: GetMyRankingReqDtoInput): GetMyRankingResDto
    @cost(weight: "10")
  rankings_Execute(request: GetRankingsReqDtoInput): GetRankingsResDto
    @cost(weight: "10")
  heatmap_Execute(request: GetHeatmapReqDtoInput): GetHeatmapResDto
    @cost(weight: "10")
  periodReport_Execute(request: GetPeriodReportReqDtoInput): GetPeriodReportResDto
    @cost(weight: "10")
  streak_Execute: GetStreakResDto @cost(weight: "10")
  statsWrongQuestions_Execute(request: GetWrongQuestionsReqDtoInput): StatsGetWrongQuestionsResDto
    @cost(weight: "10")
  createTask_Execute(request: CreateTaskReqDtoInput): CreateTaskResDto
    @cost(weight: "10")
  ownerDashboard_Execute(request: GetOwnerDashboardReqDtoInput): GetOwnerDashboardResDto
    @cost(weight: "10")
  taskDetail_Execute(request: GetTaskDetailReqDtoInput): GetTaskDetailResDto
    @cost(weight: "10")
  listMyTasks_Execute(request: ListMyTasksReqDtoInput): ListMyTasksResDto
    @cost(weight: "10")
  listTasks_Execute(request: ListTasksReqDtoInput): ListTasksResDto
    @cost(weight: "10")
}

"""
GraphQL Mutation 根类型空壳。
由 UseGraphQL() 自动注册为 HC 的 Mutation 根类型。
所有 Mutation 通过 [ExtendObjectType] 或 [GraphQLMutation] SG 自动扩展到此类型下。
"""
type Mutation {
  loginByPassword(userName: String, password: String): LoginPayload
    @cost(weight: "10")
  loginByContext(input: LoginContextInput): LoginPayload @cost(weight: "10")
  logout(broadcast: Boolean!): LoginPayload @cost(weight: "10")
  changePasswordSecure(input: ChangePasswordSecureInput): RegisterResult
    @cost(weight: "10")
  removeMember(request: RemoveMemberReqDtoInput): RemoveMemberResDto
    @cost(weight: "10")
}

"同意搭子邀请响应 DTO"
type AcceptBuddyInviteResDto {
  "是否成功"
  success: Boolean!
  "错误码（失败时）"
  errorCode: String
  "搭子关系 Uid"
  buddyId: String!
}

"成员激活响应 DTO"
